[package]
name = "cabal-rewards"
version = "0.1.0"
edition = "2021"
description = "Pays the gateway that submits a matched NEAR Intents pair, from fees the traders signed."
repository = "https://github.com/CocDap/CabalMesh"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
cabal-near = { path = "../../src-tauri/crates/cabal-near" }
