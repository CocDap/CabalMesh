name: Release Windows

# Manual-only build: Actions tab → "Release Windows" → Run workflow.
#
# Builds the NSIS installer and the MSI. The installers are not Authenticode
# signed: Windows SmartScreen warns on first run. Nothing is published: the only
# output is the workflow artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CabalMesh.exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check app version is in sync
        run: npm run version:check

      - name: Read app version
        shell: bash
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')" >> "$GITHUB_ENV"

      - name: Build Windows bundles
        run: npm run tauri -- build --ci

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: CabalMesh-${{ env.APP_VERSION }}-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
