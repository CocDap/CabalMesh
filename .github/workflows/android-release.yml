name: Release Android

# Manual-only, in the same shape as the SciKMS release workflows: Actions tab →
# "Release Android" → Run workflow, then choose where the build goes.
#
# Produces a Play upload bundle and a universal APK for sideloading. Publishing
# (draft / release / nightly) requires the signing keystore; artifact-only also
# works without it, but the output is unsigned. See docs/android-release.md.
#
# Required secrets for signed builds:
#   ANDROID_KEY_BASE64            base64 of the release .jks / .p12
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Where to publish the build"
        required: true
        default: "artifact-only"
        type: choice
        options:
          - artifact-only      # just upload as Action artifact, no Release entry
          - draft              # create a draft Release at tag (manual publish later)
          - release            # publish a Release at the chosen tag
          - nightly            # publish/overwrite the rolling 'nightly' Release
      version_tag:
        description: "Tag for draft / release modes (e.g. v0.1.0). Ignored for artifact-only / nightly."
        required: false
        default: ""
      version_code:
        description: "Android versionCode. Defaults to the workflow run number."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build CabalMesh.aab
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate inputs
        if: inputs.release_mode == 'draft' || inputs.release_mode == 'release'
        env:
          TAG: ${{ inputs.version_tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::version_tag is required for draft and release modes."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Gradle 8.14.3 cannot read the class files a newer JDK emits. The
      # project is built and verified on Temurin 21; see
      # docs/mobile-build-verification.md.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # compileSdk 36 comes from the committed Gradle file; NDK 27 matches the
      # toolchain the mobile build was verified against.
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Install Android Rust targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Read app version
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')" >> "$GITHUB_ENV"

      # Committed Gradle reads storeFile/storePassword/keyAlias/keyPassword from
      # src-tauri/gen/android/keystore.properties, and leaves the release
      # unsigned when the file is absent rather than falling back to the debug
      # key. Write the file only when the keystore secret exists.
      - name: Configure Android signing
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            printf '%s' "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/cabalmesh-release.jks"
            cd src-tauri/gen/android
            {
              echo "storeFile=$RUNNER_TEMP/cabalmesh-release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "ANDROID_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "ANDROID_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Require signing to publish
        if: inputs.release_mode != 'artifact-only' && env.ANDROID_SIGNED != 'true'
        run: |
          echo "::error::ANDROID_KEY_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are required to publish an Android build."
          exit 1

      - name: Note unsigned build
        if: env.ANDROID_SIGNED != 'true'
        run: |
          {
            echo "### Unsigned Android build"
            echo
            echo "No keystore secrets were supplied, so the AAB and APK are unsigned and cannot be uploaded to Play."
          } >> "$GITHUB_STEP_SUMMARY"

      # autoIncrementVersionCode is on in tauri.conf.json, but its counter lives
      # in the gitignored app/tauri.properties, so a fresh checkout would always
      # produce versionCode 1. Turn it off for this build and set the code
      # explicitly instead.
      - name: Build AAB and APK
        env:
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          npm run tauri -- android build --aab --apk --ci \
            --config "{\"bundle\":{\"android\":{\"autoIncrementVersionCode\":false,\"versionCode\":$VERSION_CODE}}}"

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v7
        with:
          name: CabalMesh-${{ env.APP_VERSION }}-android
          path: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release (draft / release)
        if: inputs.release_mode == 'draft' || inputs.release_mode == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ${{ inputs.version_tag }}
          draft: ${{ inputs.release_mode == 'draft' }}
          files: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to nightly Release
        if: inputs.release_mode == 'nightly'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly builds
          prerelease: true
          files: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
