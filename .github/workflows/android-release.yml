name: Release Android

# Manual-only build: Actions tab → "Release Android" → Run workflow.
#
# Produces an unsigned Play upload bundle and a universal APK for sideloading.
# Nothing is published: the only output is the workflow artifact. The build is
# unsigned on purpose, so it cannot be uploaded to Play as-is. See
# docs/android-release.md.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode. Defaults to the workflow run number."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build CabalMesh.aab
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Gradle 8.14.3 cannot read the class files a newer JDK emits. The
      # project is built and verified on Temurin 21; see
      # docs/mobile-build-verification.md.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # compileSdk 36 comes from the committed Gradle file; NDK 27 matches the
      # toolchain the mobile build was verified against.
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Install Android Rust targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Read app version
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')" >> "$GITHUB_ENV"

      # autoIncrementVersionCode is on in tauri.conf.json, but its counter lives
      # in the gitignored app/tauri.properties, so a fresh checkout would always
      # produce versionCode 1. Turn it off for this build and set the code
      # explicitly instead.
      - name: Build AAB and APK
        env:
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          npm run tauri -- android build --aab --apk --ci \
            --config "{\"bundle\":{\"android\":{\"autoIncrementVersionCode\":false,\"versionCode\":$VERSION_CODE}}}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: CabalMesh-${{ env.APP_VERSION }}-android
          path: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
