name: Release macOS

# Manual-only, in the same shape as the SciKMS release workflows: Actions tab →
# "Release macOS" → Run workflow, then choose where the build goes.
#
# Builds an Apple-silicon .dmg and a zipped .app. Without the optional APPLE_*
# secrets the app is ad-hoc signed: it installs, but Gatekeeper asks the user to
# allow it under Privacy & Security.
#
# Optional secrets for a signed/notarized build:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_TEAM_ID, APPLE_ID, APPLE_PASSWORD
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Where to publish the build"
        required: true
        default: "artifact-only"
        type: choice
        options:
          - artifact-only      # just upload as Action artifact, no Release entry
          - draft              # create a draft Release at tag (manual publish later)
          - release            # publish a Release at the chosen tag
          - nightly            # publish/overwrite the rolling 'nightly' Release
      version_tag:
        description: "Tag for draft / release modes (e.g. v0.1.0). Ignored for artifact-only / nightly."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build CabalMesh.dmg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon. Add macos-13 and the x86_64 target if
        # Intel builds are needed too.
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Validate inputs
        if: inputs.release_mode == 'draft' || inputs.release_mode == 'release'
        env:
          TAG: ${{ inputs.version_tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::version_tag is required for draft and release modes."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Read app version
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')" >> "$GITHUB_ENV"

      # Only export the signing variables that actually have a value. Tauri
      # treats an empty APPLE_CERTIFICATE as a certificate to decode, and an
      # empty APPLE_SIGNING_IDENTITY as an identity to look up.
      - name: Configure macOS signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          if [ -n "$CERT" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            } >> "$GITHUB_ENV"
            if [ -n "$IDENTITY" ]; then
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            fi
            if [ -n "$TEAM_ID" ]; then
              echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
            fi
            if [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then
              {
                echo "APPLE_ID=$NOTARY_ID"
                echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              } >> "$GITHUB_ENV"
            fi
          else
            # Ad-hoc signature: Apple silicon refuses an unsigned download.
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Build macOS bundle
        run: npm run tauri -- build --ci

      - name: Package the .app
        run: |
          ditto -c -k --keepParent \
            src-tauri/target/release/bundle/macos/CabalMesh.app \
            "CabalMesh-${APP_VERSION}-macos-arm64.app.zip"

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v7
        with:
          name: CabalMesh-${{ env.APP_VERSION }}-macos-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            CabalMesh-${{ env.APP_VERSION }}-macos-arm64.app.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release (draft / release)
        if: inputs.release_mode == 'draft' || inputs.release_mode == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ${{ inputs.version_tag }}
          draft: ${{ inputs.release_mode == 'draft' }}
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            CabalMesh-${{ env.APP_VERSION }}-macos-arm64.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to nightly Release
        if: inputs.release_mode == 'nightly'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly builds
          prerelease: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            CabalMesh-${{ env.APP_VERSION }}-macos-arm64.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
