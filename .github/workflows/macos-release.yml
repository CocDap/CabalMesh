name: Release macOS

# Manual-only build: Actions tab → "Release macOS" → Run workflow.
#
# Builds an Apple-silicon .dmg and a zipped .app. The app is ad-hoc signed,
# which needs no certificate: it installs, but Gatekeeper asks the user to allow
# it under Privacy & Security. Nothing is published: the only output is the
# workflow artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CabalMesh.dmg
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Read app version
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')" >> "$GITHUB_ENV"

      # Ad-hoc signature: Apple silicon refuses an unsigned download. This is
      # not a certificate identity, so no signing secrets are involved.
      - name: Build macOS bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --ci

      - name: Package the .app
        run: |
          ditto -c -k --keepParent \
            src-tauri/target/release/bundle/macos/CabalMesh.app \
            "CabalMesh-${APP_VERSION}-macos-arm64.app.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: CabalMesh-${{ env.APP_VERSION }}-macos-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            CabalMesh-${{ env.APP_VERSION }}-macos-arm64.app.zip
          if-no-files-found: error
          retention-days: 30
