name: Release Linux

# Manual-only build: Actions tab → "Release Linux" → Run workflow.
#
# Builds .deb, .rpm and .AppImage on Ubuntu 22.04, the oldest glibc this project
# supports, so the bundles run on more than the runner's own distro. Nothing is
# published: the only output is the workflow artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CabalMesh
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libssl-dev libfuse2 patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Read app version
        run: echo "APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')" >> "$GITHUB_ENV"

      - name: Build Linux bundles
        run: npm run tauri -- build --ci

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: CabalMesh-${{ env.APP_VERSION }}-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
