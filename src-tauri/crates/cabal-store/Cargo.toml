[package]
name = "cabal-store"
version = "0.1.0"
edition = "2021"
description = "Crash-safe typed persistence. Paths are injected, never discovered."
publish = false

[dependencies]
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { workspace = true }
